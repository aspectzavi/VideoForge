[project]
name = "videoforge"
version = "0.1.0"
description = "Professional AI-powered video processing toolkit built on FFmpeg."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Kevin Kamau", email = "envisio.io@gmail.com" }
]

license = { text = "MIT" }

keywords = [
    "ffmpeg",
    "video",
    "editing",
    "captions",
    "ai",
    "automation",
    "tiktok",
    "youtube",
    "shorts",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    # CLI
    "typer>=0.16.0",
    "rich>=14.0.0",
    # Configuration
    "pydantic>=2.11.0",
    "pydantic-settings>=2.10.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    # Logging
    "loguru>=0.7.3",
    # FFmpeg
    "ffmpeg-python>=0.2.0",
    # Image / Video
    "opencv-python>=4.12.0",
    "numpy>=2.2.0",
    "Pillow>=11.3.0",
    # AI
    "faster-whisper>=1.2.0",
    # Utilities
    "tqdm>=4.67.0",
    "psutil>=7.0.0",
    "platformdirs>=4.4.0",
    "packaging>=25.0",
    "typing-extensions>=4.14.0",
]

[project.optional-dependencies]
ai = [
    "torch",
    "torchvision",
    "torchaudio",
    "mediapipe",
    "whisperx",
]

dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "black",
    "mypy",
    "pre-commit",
    "ipython",
]

[project.urls]
Homepage = "https://github.com/aspectzavi/VideoForge"
Repository = "https://github.com/aspectzavi/VideoForge"
Issues = "https://github.com/aspectzavi/VideoForge/issues"

[project.scripts]
videoforge = "videoforge.apps.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videoforge"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

ignore = [
    "E501",
    "B027",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]

testpaths = [
    "tests",
]

markers = [
    "integration: exercises real FFmpeg/FFprobe subprocesses; slower, not mocked.",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = [
    "src/videoforge",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

